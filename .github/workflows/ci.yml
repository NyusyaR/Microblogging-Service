name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: pass_test
          POSTGRES_DB: microblogging_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user_test -d microblogging_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_USER: user_test
      DB_PASSWORD: pass_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: microblogging_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (isort)
        run: |
          isort --check-only .

      - name: Format (black)
        run: |
          black --check --diff .

      - name: Lint (flake8)
        run: |
          flake8 --max-line-length=88 .

      - name: Type check (mypy)
        run: |
          mypy service_app

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest -q